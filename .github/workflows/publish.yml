name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore UniqueItemTransferPlugin.csproj
      - name: Build
        run: dotnet build UniqueItemTransferPlugin.csproj -c Release --no-restore
      - name: Determine version
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' UniqueItemTransferPlugin.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=UniqueItemTransferPlugin-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
      - name: Create plugin bundle
        run: |
          mkdir -p package
          cp bin/Release/net10.0/UniqueItemTransferPlugin.dll package/
          cp bin/Release/net10.0/UniqueItemTransferPlugin.deps.json package/
          cp README.md LICENSE.txt package/
          cd package && zip -r "../${{ steps.version.outputs.zip }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: UniqueItemTransferPlugin-v${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.zip }}
      - name: Upload to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.version.outputs.zip }}" --clobber
