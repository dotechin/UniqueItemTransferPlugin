<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniqueItemTransfer — Whitelist Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 1.5rem;
    }
    h1 { font-size: 1.5rem; color: #7eb8f7; margin-bottom: 1rem; }
    h2 { font-size: 1rem; color: #aac8e8; margin-bottom: 0.5rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    select, button, input[type="number"] {
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      border: 1px solid #444;
      background: #16213e;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 0.875rem;
    }
    select:focus, button:focus, input:focus { outline: 2px solid #7eb8f7; }
    button:hover { background: #0f3460; }
    button.danger { border-color: #c0392b; }
    button.danger:hover { background: #c0392b; }
    button.primary { background: #0f3460; border-color: #7eb8f7; }
    button.primary:hover { background: #1a5480; }
    #status {
      font-size: 0.85rem;
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
      display: none;
    }
    #status.ok  { background: #1a4a1a; border: 1px solid #2e8b2e; color: #90ee90; display: block; }
    #status.err { background: #4a1a1a; border: 1px solid #8b2e2e; color: #ff9090; display: block; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      padding: 0.45rem 0.6rem;
      text-align: left;
      border-bottom: 1px solid #2a2a4a;
    }
    th { background: #16213e; color: #aac8e8; }
    tr:hover td { background: #1e2d4e; }
    tr.selected td { background: #0f3460; }
    .pagination {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      font-size: 0.85rem;
    }
    #pageInfo { color: #aac8e8; min-width: 6rem; text-align: center; }
    kbd {
      background: #2a2a4a;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 0.8rem;
    }
    .hint { color: #888; font-size: 0.8rem; margin-top: 1rem; }
    #loadingMsg { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <h1>UniqueItemTransfer — Whitelist Manager</h1>

  <div id="status"></div>

  <div class="toolbar">
    <label for="typeFilter">Item type:</label>
    <select id="typeFilter">
      <option value="">All types</option>
    </select>
    <label for="pageSizeSelect">Per page:</label>
    <select id="pageSizeSelect">
      <option value="20">20</option>
      <option value="50" selected>50</option>
      <option value="100">100</option>
    </select>
    <button id="btnRefresh" class="primary">↺ Refresh</button>
    <button id="btnRemoveSelected">Remove selected</button>
    <button id="btnClearAll" class="danger">Clear all</button>
  </div>

  <div id="loadingMsg">Loading…</div>
  <table id="wlTable" style="display:none">
    <thead>
      <tr>
        <th><input type="checkbox" id="chkAll" title="Select all on this page" /></th>
        <th>#</th>
        <th>Name</th>
        <th>Type</th>
        <th>ClassID</th>
        <th>AppID</th>
      </tr>
    </thead>
    <tbody id="wlBody"></tbody>
  </table>

  <div class="pagination">
    <button id="btnPrev">◀ Prev</button>
    <span id="pageInfo">—</span>
    <button id="btnNext">Next ▶</button>
  </div>

  <p class="hint">
    Keyboard: <kbd>←</kbd> / <kbd>→</kbd> page, <kbd>Space</kbd> toggle row, <kbd>Del</kbd> remove selected.
  </p>

  <script>
    const API_BASE = '/api/UniqueItemTransfer';
    let currentPage = 1;
    let totalPages = 1;
    let selectedIndices = new Set();

    const statusEl     = document.getElementById('status');
    const loadingMsg   = document.getElementById('loadingMsg');
    const table        = document.getElementById('wlTable');
    const tbody        = document.getElementById('wlBody');
    const chkAll       = document.getElementById('chkAll');
    const pageInfo     = document.getElementById('pageInfo');
    const typeFilter   = document.getElementById('typeFilter');
    const pageSizeEl   = document.getElementById('pageSizeSelect');
    const btnPrev      = document.getElementById('btnPrev');
    const btnNext      = document.getElementById('btnNext');
    const btnRefresh   = document.getElementById('btnRefresh');
    const btnRemove    = document.getElementById('btnRemoveSelected');
    const btnClear     = document.getElementById('btnClearAll');

    function showStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = isError ? 'err' : 'ok';
      clearTimeout(showStatus._t);
      if (!isError) showStatus._t = setTimeout(() => { statusEl.className = ''; }, 4000);
    }

    async function loadTypes() {
      try {
        const res = await fetch(`${API_BASE}/whitelist/types`);
        if (!res.ok) return;
        const types = await res.json();
        types.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          typeFilter.appendChild(opt);
        });
      } catch { /* ignore */ }
    }

    async function loadPage(page) {
      loadingMsg.style.display = '';
      table.style.display = 'none';
      const type = typeFilter.value;
      const pageSize = pageSizeEl.value;
      const params = new URLSearchParams({ page, pageSize });
      if (type) params.set('type', type);

      let data;
      try {
        const res = await fetch(`${API_BASE}/whitelist?${params}`);
        if (!res.ok) throw new Error(await res.text());
        data = await res.json();
      } catch (e) {
        loadingMsg.textContent = 'Failed to load whitelist.';
        showStatus(String(e), true);
        return;
      }

      currentPage = data.page;
      totalPages  = data.totalPages;

      tbody.innerHTML = '';
      selectedIndices.clear();
      chkAll.checked = false;

      if (data.entries.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td colspan="6" style="text-align:center;color:#888">No entries.</td>';
        tbody.appendChild(tr);
      } else {
        data.entries.forEach(entry => {
          const tr = document.createElement('tr');
          tr.dataset.index = entry.index;
          tr.innerHTML = `
            <td><input type="checkbox" class="rowChk" data-index="${entry.index}" /></td>
            <td>${entry.index}</td>
            <td>${entry.name ?? '—'}</td>
            <td>${entry.type}</td>
            <td>${entry.classID}</td>
            <td>${entry.realAppID}</td>
          `;
          tr.querySelector('.rowChk').addEventListener('change', e => {
            const idx = +e.target.dataset.index;
            if (e.target.checked) { selectedIndices.add(idx); tr.classList.add('selected'); }
            else { selectedIndices.delete(idx); tr.classList.remove('selected'); }
            chkAll.checked = selectedIndices.size === data.entries.length;
          });
          tr.addEventListener('click', e => {
            if (e.target.tagName === 'INPUT') return;
            const chk = tr.querySelector('.rowChk');
            chk.checked = !chk.checked;
            chk.dispatchEvent(new Event('change'));
          });
          tbody.appendChild(tr);
        });
      }

      pageInfo.textContent = `Page ${currentPage} / ${totalPages}  (${data.totalCount} total)`;
      btnPrev.disabled = currentPage <= 1;
      btnNext.disabled = currentPage >= totalPages;
      loadingMsg.style.display = 'none';
      table.style.display = '';
    }

    chkAll.addEventListener('change', () => {
      document.querySelectorAll('.rowChk').forEach(chk => {
        const tr = chk.closest('tr');
        chk.checked = chkAll.checked;
        if (chkAll.checked) { selectedIndices.add(+chk.dataset.index); tr.classList.add('selected'); }
        else { selectedIndices.delete(+chk.dataset.index); tr.classList.remove('selected'); }
      });
    });

    btnRefresh.addEventListener('click', () => loadPage(1));
    typeFilter.addEventListener('change', () => loadPage(1));
    pageSizeEl.addEventListener('change', () => loadPage(1));
    btnPrev.addEventListener('click', () => { if (currentPage > 1) loadPage(currentPage - 1); });
    btnNext.addEventListener('click', () => { if (currentPage < totalPages) loadPage(currentPage + 1); });

    btnRemove.addEventListener('click', async () => {
      if (selectedIndices.size === 0) { showStatus('Nothing selected.', true); return; }
      if (!confirm(`Remove ${selectedIndices.size} selected entry/entries?`)) return;

      // Sort descending so higher indices don't shift lower ones
      const sorted = [...selectedIndices].sort((a, b) => b - a);
      let errors = 0;
      for (const idx of sorted) {
        try {
          const res = await fetch(`${API_BASE}/whitelist/${idx}`, { method: 'DELETE' });
          if (!res.ok) errors++;
        } catch { errors++; }
      }

      if (errors > 0) showStatus(`Removed with ${errors} error(s).`, true);
      else showStatus(`Removed ${sorted.length} entry/entries.`, false);
      loadPage(currentPage);
    });

    btnClear.addEventListener('click', async () => {
      if (!confirm('Clear ALL whitelist entries? This cannot be undone.')) return;
      try {
        const res = await fetch(`${API_BASE}/whitelist?confirm=true`, { method: 'DELETE' });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        showStatus(`Cleared ${data.cleared} entries.`, false);
        loadPage(1);
      } catch (e) {
        showStatus(String(e), true);
      }
    });

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'ArrowLeft'  && !btnPrev.disabled) loadPage(currentPage - 1);
      if (e.key === 'ArrowRight' && !btnNext.disabled) loadPage(currentPage + 1);
      if (e.key === 'Delete' || e.key === 'Backspace') btnRemove.click();
      if (e.key === ' ') {
        e.preventDefault();
        // Toggle first visible unchecked, or uncheck all
        const chks = [...document.querySelectorAll('.rowChk')];
        const firstUnchecked = chks.find(c => !c.checked);
        if (firstUnchecked) { firstUnchecked.checked = true; firstUnchecked.dispatchEvent(new Event('change')); }
        else chkAll.checked = false, chkAll.dispatchEvent(new Event('change'));
      }
    });

    (async () => {
      await loadTypes();
      loadPage(1);
    })();
  </script>
</body>
</html>
